name: Release

# Tag push only (v1.2.3 etc) -- this builds and publishes a real GitHub
# Release, not something that should fire on every push/PR the way
# tests.yml does. build.ps1 stays as-is for local dev builds; this
# replaces the manual "build.ps1 then gh release create" step it prints
# as a hint, for actual tagged releases.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    # windows-latest, not ubuntu -- same reasoning as tests.yml: this app
    # is Windows-only in practice (SWTOR's own log format/paths, winsound,
    # the PyInstaller build itself), so that's the only platform a release
    # build is meaningful for.
    runs-on: windows-latest
    permissions:
      contents: write  # gh release create needs this to publish/attach assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches tests.yml -- same reasoning: what this project is
          # actually developed against.
          python-version: "3.14"

      - name: Install build dependencies
        run: pip install pywebview requests pyinstaller

      - name: Build
        run: .\build.ps1

      - name: Verify tag matches version.py
        # Catches the "forgot to bump __version__ before tagging" mistake
        # at build time instead of shipping a release zip with the wrong
        # version string baked into its filename.
        shell: pwsh
        run: |
          $version = (Get-Content version.py | Select-String '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
              Write-Error "Tag $tag does not match version.py's __version__ ($version)"
          }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content version.py | Select-String '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          gh release create "${{ github.ref_name }}" "dist\swtor-parser-v$version-win64.zip" `
            --title "${{ github.ref_name }}" `
            --generate-notes
