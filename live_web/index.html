<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPS — Live</title>
<link rel="stylesheet" href="/app.css">
<style>
  /* Page-specific: a timer row (label + countdown + meter) isn't a shape
     app.css defines yet, so it lives here rather than in the shared file
     the corpus browser also uses. */
  .timer-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
  .timer-row .lbl { flex: 0 0 180px; color: var(--ink); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .timer-row .rem { flex: 0 0 42px; text-align: right; color: var(--ink-muted);
    font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .timer-row .meter { flex: 1; }
  .alert-banner { font-size: 15px; font-weight: 700; color: var(--critical);
    letter-spacing: .02em; padding: 3px 0; }
  main { padding-top: 18px; }
  .live-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .live-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <div class="brand">DPS<em>live</em></div>
  <div class="status" id="boss-status">—</div>
  <div class="spacer"></div>
  <div class="status" id="duration">Encounter: 0.0s</div>
</header>

<main>
  <div id="alerts"></div>

  <div class="panel">
    <h2>Meter</h2>
    <div class="tw"><table id="meter">
      <thead><tr>
        <th>Player</th><th>DPS</th><th>HPS</th><th>Damage Taken</th><th>Mitigated</th><th>Deaths</th>
      </tr></thead>
      <tbody></tbody>
    </table></div>
    <p class="empty" id="meter-empty" style="display:none">No combat data yet.</p>
  </div>

  <div class="live-grid">
    <div class="panel">
      <h2>Active Timers</h2>
      <div id="timers"></div>
      <p class="empty" id="timers-empty" style="display:none">none active</p>
    </div>
    <div class="panel">
      <h2>Cooldowns</h2>
      <div id="cooldowns"></div>
      <p class="empty" id="cooldowns-empty" style="display:none">none active</p>
    </div>
    <div class="panel">
      <h2>DoTs / HoTs</h2>
      <div id="dotshots"></div>
      <p class="empty" id="dotshots-empty" style="display:none">none active</p>
    </div>
    <div class="panel">
      <h2>Taunts</h2>
      <div id="taunts"></div>
      <p class="empty" id="taunts-empty" style="display:none">no taunts cast yet</p>
    </div>
  </div>
</main>

<script src="/app.js"></script>
</body>
</html>
